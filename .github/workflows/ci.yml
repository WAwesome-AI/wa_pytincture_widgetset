# Runs on every push to main and every pull request: unit tests, JavaScript
# syntax, the asset-manifest drift check, and a build whose wheel and sdist are
# verified the way pytincture verifies them in the browser.
#
# On a pull request from a branch in this repository, a stale asset manifest
# is regenerated and committed to the branch instead of failing (two PRs that
# both touch wapyt/assets/ leave it stale as soon as one merges and the other
# is updated from main). The commit is pushed with the MANIFEST_BOT_TOKEN
# secret, a fine-grained token with Contents: read and write on this repo:
# a push made with the built-in GITHUB_TOKEN would be held for approval and
# its results kept off the pull request. Without the secret, and for pull
# requests from forks, a stale manifest fails with the command to run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      fixed: ${{ steps.regen.outputs.fixed }}
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      HAS_TOKEN: ${{ secrets.MANIFEST_BOT_TOKEN != '' }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself, not the merge commit, so a fix can be pushed.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          # Empty on forks and when the secret is unset; checkout then falls
          # back to GITHUB_TOKEN and the job only checks.
          token: ${{ secrets.MANIFEST_BOT_TOKEN || github.token }}

      - name: Regenerate the asset manifest if it is stale
        id: regen
        run: |
          if python3 scripts/generate_assets_manifest.py . --check; then
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SAME_REPO" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The asset manifest is stale. Run: python scripts/generate_assets_manifest.py . and commit wapyt/pytincture-assets.json"
            exit 1
          fi
          python3 scripts/generate_assets_manifest.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wapyt/pytincture-assets.json
          git commit -m "Regenerate the asset manifest" -m "Committed by CI: the manifest's asset hashes or version no longer matched."
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "fixed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Committed a regenerated asset manifest to $HEAD_REF; CI runs again on that commit. Pull before pushing more work."

  test:
    needs: manifest
    # Runs when the manifest job passed without pushing a fix, or did not run
    # (pushes to main). After a fix, the push starts a new run on the fixed
    # commit, so this one stands down.
    if: >-
      always() &&
      (needs.manifest.result == 'skipped' ||
       (needs.manifest.result == 'success' && needs.manifest.outputs.fixed != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: uv run --group dev pytest tests/ -q

      - name: JavaScript syntax
        run: for f in wapyt/assets/*.js; do node --check "$f"; done

      # Fails when an asset changed (or the version moved) without running
      # `python scripts/generate_assets_manifest.py .` and committing the result.
      - name: Asset manifest is current
        run: python scripts/generate_assets_manifest.py . --check

      - name: Build
        run: uv build --out-dir dist

      - name: Verify the built wheel and sdist
        run: python scripts/check_dist.py dist
