[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wapyt"
version = "0.1.0"
description = "DHTMLX-free PyTincture widgetset with layout, chat, card panel, and tab widgets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["pytincture", "widgetset", "pyodide", "wapyt"]
# No runtime dependencies: `pyodide.ffi` is provided by the Pyodide runtime itself
# (soft-imported in _runtime.py), not by the `pyodide-py` distribution. Declaring
# either here forces micropip to resolve them in the browser at install time.
dependencies = []

[project.urls]
homepage = "https://github.com/WAwesome-AI/wa_pytincture_widgetset"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
