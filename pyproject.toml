[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wapyt"
version = "0.2.0.dev0"
description = "DHTMLX-free pyTincture widgetset: layouts, forms, tables, trees, chat, terminal, menus, Kanban and more, declared in Python and rendered in the browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["pytincture", "widgetset", "pyodide", "wapyt"]
# No runtime dependencies: `pyodide.ffi` is provided by the Pyodide runtime itself
# (soft-imported in _runtime.py), not by the `pyodide-py` distribution. Declaring
# either here forces micropip to resolve them in the browser at install time.
dependencies = []

[project.urls]
homepage = "https://github.com/WAwesome-AI/wa_pytincture_widgetset"
documentation = "https://github.com/WAwesome-AI/wa_pytincture_widgetset/wiki"
changelog = "https://github.com/WAwesome-AI/wa_pytincture_widgetset/wiki/Widget-Catalog#changes"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Only wapyt: without this, tests/ (demo apps and unit tests) was packed as a
# top-level `tests` package and installed into site-packages.
include = ["wapyt*"]
